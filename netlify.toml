[build]
  command = "npm run build"
  publish = "dist"
  functions = "functions"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  framework = "vite"

[[redirects]]
  from = "/sitemap.xml"
  to = "/public/sitemap.xml"
  status = 200

# SPA fallback
  [[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
